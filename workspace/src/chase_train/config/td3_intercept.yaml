# Arm T on the INTERCEPT task extension (sim_training_architecture.md 1):
# capture terminal at r_cap with bonus B, potential-based range shaping
# (policy-invariant by Ng et al. 1999), closing law on the forward axis,
# approach-band resets. The PN baseline is the null to beat.
arm: td3
env:
  task: intercept
  scenario: mix
  episode_steps: 300
  latency: true
  corruption: true
  obs_mode: latency_aware
  k: 4
  reward_version: repaired
  r_cap_m: 0.5
  capture_bonus: 10.0
  shaping_lambda: 0.1
nets:
  hidden_actor: [256, 256]
  hidden_critic: [256, 256]
  final_init: 3.0e-3
train:
  total_steps: 200000
  gamma: 0.99
  tau: 0.005
  batch: 64
  buffer: 100000
  actor_lr: 3.0e-4
  critic_lr: 3.0e-4
  start_steps: 1000
  update_after: 1000
  policy_delay: 2
  target_noise: 0.2
  noise_clip: 0.5
  noise: {type: gaussian, sigma0: 0.3, sigma_min: 0.05}
  demo_prefill_episodes: 20
eval:
  every: 5000
  episodes_per_scenario: 10
curriculum:
  enabled: true
